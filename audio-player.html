<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音檔無限循環播放</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
      color: #333;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      width: 80%;
      max-width: 400px;
    }
    audio {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>重複播放器</h2>
    <!-- loop 屬性就是讓音檔一直重複的核心鍵 -->
    <audio controls loop preload="auto">
      <source src="audio.m4a" type="audio/mpeg">
      您的瀏覽器不支援音訊播放。
    </audio>
  </div>

</body>
</html>
