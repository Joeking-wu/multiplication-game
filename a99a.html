<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>三位數 × 二位數直式乘法練習</title>
<style>
  body{
    font-family:"Microsoft JhengHei", Arial, sans-serif;
    margin:24px;
    background:#fafafa;
    color:#222;
  }
  h1{font-size:24px;margin-bottom:8px;}
  .note{
    background:#fff2cc;
    border:1px solid #e0c36a;
    padding:10px 12px;
    line-height:1.6;
    max-width:820px;
    margin-bottom:16px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  button{
    font-size:16px;
    padding:8px 14px;
    border:1px solid #777;
    border-radius:6px;
    background:white;
    cursor:pointer;
  }
  button:hover{background:#f0f0f0;}
  .problemBox{
    display:inline-block;
    background:white;
    padding:18px 22px 22px;
    border:1px solid #ccc;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  table{
    border-collapse:collapse;
    table-layout:fixed;
  }
  th{
    width:58px;
    height:30px;
    font-size:18px;
    font-weight:500;
    text-align:center;
  }
  td{
    width:58px;
    height:48px;
    border:1px dashed #777;
    text-align:center;
    vertical-align:middle;
    font-size:26px;
    position:relative;
  }
  td.label{
    width:44px;
    border:none;
    font-size:26px;
    font-weight:bold;
  }
  td.noBorder{border:none;}
  tr.lineTop td.grid{
    border-top:4px solid #000;
  }
  tr.resultTop td.grid{
    border-top:4px solid #000;
  }
  input.cell{
    width:50px;
    height:42px;
    border:none;
    outline:none;
    text-align:center;
    font-size:26px;
    background:transparent;
    font-family:"Microsoft JhengHei", Arial, sans-serif;
  }
  .fixed{
    font-size:28px;
  }
  .ok{
    background:#d9ead3 !important;
  }
  .bad{
    background:#f4cccc !important;
  }
  .emptyExpected{
    background:#eeeeee !important;
  }
  .hint{
    font-size:14px;
    color:#555;
    margin-top:12px;
    line-height:1.6;
  }
  #message{
    margin-top:14px;
    font-size:18px;
    font-weight:bold;
  }
  .small{
    font-size:14px;
    color:#555;
  }
</style>
</head>
<body>
<h1>三位數 × 二位數直式乘法練習</h1>

<div class="note">
  這個版本已修改：如果題目像 <b>582 × 20</b>，乘數個位是 0，<br>
  「個位部分積」會要求填成 <b>0、0、0</b>，而不是只在個位寫一個 0。
</div>

<div class="toolbar">
  <button onclick="newProblem()">換一題</button>
  <button onclick="makeOnesZeroProblem()">出一題個位是 0 的題目</button>
  <button onclick="checkAnswer()">檢查答案</button>
  <button onclick="showAnswer()">顯示答案</button>
  <button onclick="clearInputs()">清除填寫</button>
  <span class="small">題目：<span id="questionText"></span></span>
</div>

<div class="problemBox">
<table id="grid">
  <tr>
    <th></th>
    <th>十萬</th>
    <th>萬</th>
    <th>千</th>
    <th>百</th>
    <th>十</th>
    <th>個</th>
  </tr>

  <tr data-row="carryTen">
    <td class="label noBorder"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
  </tr>

  <tr data-row="carryOne">
    <td class="label noBorder"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
  </tr>

  <tr data-row="topNumber">
    <td class="label noBorder"></td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
  </tr>

  <tr data-row="bottomNumber">
    <td class="label noBorder">×</td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
    <td class="grid fixed"></td>
  </tr>

  <tr class="lineTop" data-row="partialOne">
    <td class="label noBorder"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
  </tr>

  <tr data-row="partialTen">
    <td class="label noBorder"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
  </tr>

  <tr class="resultTop" data-row="result">
    <td class="label noBorder"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
    <td class="grid"><input class="cell" inputmode="numeric" maxlength="1"></td>
  </tr>
</table>

<div id="message"></div>
<div class="hint">
  修改重點：乘數個位為 0 時，個位部分積會顯示並檢查為 000，例如 582 × 20 的第一層部分積要填 0、0、0。
</div>
</div>

<script>
let A = 0;
let B = 0;
let expected = {};

const rowNames = ["carryTen","carryOne","partialOne","partialTen","result"];
const colCount = 6; // 十萬、萬、千、百、十、個

function randInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function digitsToCols(n){
  const s = String(n);
  const arr = Array(colCount).fill("");
  for(let i = 0; i < s.length && i < colCount; i++){
    arr[colCount - s.length + i] = s[i];
  }
  return arr;
}

// 這個函式是本次主要修改處：
// 若 forceDigits 有指定，例如 3，則 0 會變成 000，並放在百、十、個三格。
function digitsToColsWithMinimumDigits(n, forceDigits){
  let s = String(n);
  if(forceDigits && s.length < forceDigits){
    s = s.padStart(forceDigits, "0");
  }
  const arr = Array(colCount).fill("");
  for(let i = 0; i < s.length && i < colCount; i++){
    arr[colCount - s.length + i] = s[i];
  }
  return arr;
}

function carryArrayForMultiplyByDigit(num, digit, shift){
  const digits = String(num).padStart(3, "0").split("").map(Number); // [百,十,個]
  const arr = Array(colCount).fill("");

  let carry = 0;

  let p1 = digits[2] * digit + carry;
  carry = Math.floor(p1 / 10);
  if(carry > 0) arr[4 - shift] = String(carry);

  let p2 = digits[1] * digit + carry;
  carry = Math.floor(p2 / 10);
  if(carry > 0) arr[3 - shift] = String(carry);

  let p3 = digits[0] * digit + carry;
  carry = Math.floor(p3 / 10);
  if(carry > 0) arr[2 - shift] = String(carry);

  return arr;
}

function setFixedNumber(rowName, arr){
  const row = document.querySelector(`tr[data-row="${rowName}"]`);
  const cells = row.querySelectorAll("td.grid");
  cells.forEach((td, i) => {
    td.textContent = arr[i] || "";
  });
}

function getInputs(rowName){
  const row = document.querySelector(`tr[data-row="${rowName}"]`);
  return Array.from(row.querySelectorAll("input.cell"));
}

function setInputRow(rowName, arr){
  const inputs = getInputs(rowName);
  inputs.forEach((inp, i) => inp.value = arr[i] || "");
}

function clearInputClasses(){
  document.querySelectorAll("input.cell").forEach(inp => {
    inp.parentElement.classList.remove("ok","bad","emptyExpected");
  });
}

function clearInputs(){
  document.querySelectorAll("input.cell").forEach(inp => inp.value = "");
  clearInputClasses();
  document.getElementById("message").textContent = "";
}

function setupProblem(a, b){
  A = a;
  B = b;

  const tens = Math.floor(B / 10);
  const ones = B % 10;

  const partialOne = A * ones;
  const partialTen = A * tens * 10;
  const result = A * B;

  expected = {
    carryTen: carryArrayForMultiplyByDigit(A, tens, 1),
    carryOne: carryArrayForMultiplyByDigit(A, ones, 0),

    // 修改處：
    // 個位乘數是 0 時，要求個位部分積寫成 000。
    // 否則照一般部分積顯示。
    partialOne: ones === 0 ? digitsToColsWithMinimumDigits(0, 3) : digitsToCols(partialOne),

    partialTen: digitsToCols(partialTen),
    result: digitsToCols(result)
  };

  setFixedNumber("topNumber", digitsToCols(A));
  setFixedNumber("bottomNumber", digitsToCols(B));

  document.getElementById("questionText").textContent = `${A} × ${B}`;
  clearInputs();
}

function newProblem(){
  setupProblem(randInt(100, 999), randInt(10, 99));
}

function makeOnesZeroProblem(){
  const a = randInt(100, 999);
  const b = randInt(1, 9) * 10;
  setupProblem(a, b);
}

function normalize(v){
  return String(v || "").trim();
}

function isCorrectCell(rowName, colIndex, userValue, correctValue){
  userValue = normalize(userValue);
  correctValue = normalize(correctValue);

  if(correctValue === ""){
    return userValue === "";
  }

  // 十位部分積最右邊個位：孩子空白或寫 0 都接受。
  if(rowName === "partialTen" && colIndex === 5 && correctValue === "0"){
    return userValue === "" || userValue === "0";
  }

  return userValue === correctValue;
}

function checkAnswer(){
  clearInputClasses();
  let total = 0;
  let correct = 0;

  rowNames.forEach(rowName => {
    const inputs = getInputs(rowName);
    inputs.forEach((inp, i) => {
      total++;
      const answer = expected[rowName][i] || "";
      const user = inp.value;
      const ok = isCorrectCell(rowName, i, user, answer);

      if(ok){
        correct++;
        inp.parentElement.classList.add(answer === "" ? "emptyExpected" : "ok");
      }else{
        inp.parentElement.classList.add("bad");
      }
    });
  });

  const msg = document.getElementById("message");
  if(correct === total){
    msg.textContent = "全部正確！";
    msg.style.color = "#38761d";
  }else{
    msg.textContent = `目前 ${correct} / ${total} 格正確，紅色格子再檢查看看。`;
    msg.style.color = "#990000";
  }
}

function showAnswer(){
  rowNames.forEach(rowName => {
    setInputRow(rowName, expected[rowName]);
  });
  document.getElementById("message").textContent = "已顯示答案。";
  document.getElementById("message").style.color = "#555";
  clearInputClasses();
}

document.addEventListener("input", function(e){
  if(e.target.classList.contains("cell")){
    e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0,1);
    e.target.parentElement.classList.remove("ok","bad","emptyExpected");
  }
});

document.addEventListener("keydown", function(e){
  if(!e.target.classList.contains("cell")) return;
  const inputs = Array.from(document.querySelectorAll("input.cell"));
  const idx = inputs.indexOf(e.target);
  if(e.key === "ArrowRight" && idx < inputs.length - 1){
    inputs[idx + 1].focus();
  }else if(e.key === "ArrowLeft" && idx > 0){
    inputs[idx - 1].focus();
  }else if(e.key === "ArrowDown" && idx + 6 < inputs.length){
    inputs[idx + 6].focus();
  }else if(e.key === "ArrowUp" && idx - 6 >= 0){
    inputs[idx - 6].focus();
  }
});

newProblem();
</script>
</body>
</html>
